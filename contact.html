    <main>
        <form id="contact-form">
            <label>Naam
                <input type="text" name="name" placeholder="Je naam" required>
            </label>
            <label>Email Address
                <input type="email" name="email" placeholder="email@email.com" required>
            </label>
            <br>

            <label>Message
                <textarea
                name="messagee"
                rows="5"
                minlength="10"
                placeholder="Contacteer mij!"
                required></textarea>
            </label>
            <input type="submit">
            <p id="form-result" role="status"></p>
        </form> 
    </main>
    
</body>
