    <main>
        <form id="contact-form">
            <label>Name
                <input type="text" name="name" placeholder="Your name" required>
            </label>
            <label>Email Address
                <input type="email" name="email" placeholder="email@email.com" required>
            </label>
            <br>

            <label>Message
                <textarea
                name="messagee"
                rows="5"
                minlength="10"
                placeholder="Contact me!"
                required></textarea>
            </label>
            <input type="submit">
            <p id="form-result" role="status"></p>
        </form> 
    </main>
    
</body>
